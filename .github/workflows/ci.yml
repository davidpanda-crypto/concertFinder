name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements_concerts.txt

      - name: Compile check
        run: python -m py_compile app.py

      - name: Import check
        run: python -c "import app; print('app module loaded OK')"
