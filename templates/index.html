<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Concert Finder</title>
  <style>
    :root {
      --bg:       #0d0d0d;
      --surface:  #181818;
      --surface2: #222;
      --border:   #2c2c2c;
      --accent:   #a855f7;
      --accent2:  #ec4899;
      --green:    #22c55e;
      --text:     #efefef;
      --muted:    #777;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ---- Header ---- */
    header {
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    /* ---- Layout ---- */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* ---- Search card ---- */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
    }

    .search-card label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
    }

    .input-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }

    .input-row input:focus { border-color: var(--accent); }
    .input-row input::placeholder { color: var(--muted); }

    .search-btn {
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .search-btn:hover:not(:disabled) { opacity: 0.88; }
    .search-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Playlist pill */
    #playlist-pill {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      padding: 0.6rem 0.9rem;
      background: var(--surface2);
      border-radius: 8px;
    }

    #playlist-pill img {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    #playlist-pill span {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Progress ---- */
    #progress-section {
      display: none;
      margin-bottom: 1.75rem;
    }

    .status-line {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .bar-track {
      background: var(--surface2);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .bar-label {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    /* ---- Summary ---- */
    #summary {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    #summary strong { color: var(--accent); }

    /* ---- Error ---- */
    .error-box {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    /* ---- Results ---- */
    #results {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Artist card */
    .artist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      animation: pop-in 0.3s ease both;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .artist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
    }

    .artist-name {
      font-size: 1rem;
      font-weight: 700;
    }

    .artist-name a {
      color: #1DB954;
      font-size: 0.78rem;
      font-weight: 500;
      text-decoration: none;
      margin-left: 0.6rem;
      vertical-align: middle;
    }

    .artist-name a:hover { text-decoration: underline; }

    .show-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface2);
      padding: 0.2rem 0.65rem;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Concert rows */
    .concert-list { list-style: none; }

    .concert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .concert-row:last-child { border-bottom: none; }

    .concert-info { min-width: 0; }

    .concert-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.3rem;
    }

    .concert-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.8rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .price-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--green);
      background: rgba(34,197,94,0.1);
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
    }

    .tix-btn {
      flex-shrink: 0;
      display: inline-block;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      color: #fff;
      text-decoration: none;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .tix-btn:hover { opacity: 0.88; }

    /* Download button */
    .download-btn {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s;
      margin-left: 0.75rem;
      vertical-align: middle;
    }
    .download-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 3.5rem 1rem;
    }

    .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.4rem; }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    @media (max-width: 540px) {
      header h1 { font-size: 1.6rem; }
      .input-row { flex-direction: column; }
      .concert-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header>
  <h1>NYC Concert Finder</h1>
  <p>Paste any Spotify playlist — see upcoming New York City shows</p>
</header>

<main>

  <!-- Search -->
  <div class="search-card">
    <label for="playlist-url">Spotify Playlist URL</label>
    <div class="input-row">
      <input
        id="playlist-url"
        type="text"
        placeholder="https://open.spotify.com/playlist/..."
        value="{{ default_playlist }}"
        onkeydown="if(event.key==='Enter') startSearch()"
      />
      <button class="search-btn" id="search-btn" onclick="startSearch()">Find Concerts</button>
    </div>
    <div id="playlist-pill">
      <img id="pill-img" src="" alt="" />
      <span id="pill-name"></span>
    </div>
  </div>

  <!-- Progress -->
  <div id="progress-section">
    <div class="status-line" id="status-text">Starting...</div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="bar-label" id="bar-label"></div>
  </div>

  <!-- Summary + download -->
  <div id="summary-row" style="display:none; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:0.5rem;">
    <div id="summary" style="display:block; margin-bottom:0; flex:1; min-width:200px;"></div>
    <button class="download-btn" id="dl-btn" onclick="downloadTxt()">Save as TXT</button>
  </div>

  <!-- Results -->
  <div id="results"></div>

</main>

<footer>Concert data from Ticketmaster &bull; Artist data from Spotify</footer>

<script>
  let es = null;
  let allResults = [];   // accumulates {artist, concerts[]} as they stream in
  let playlistLabel = 'NYC Concerts';

  function startSearch() {
    const url = document.getElementById('playlist-url').value.trim();
    if (!url) return;

    // Reset
    allResults = [];
    document.getElementById('results').innerHTML = '';
    document.getElementById('summary-row').style.display = 'none';
    document.getElementById('summary').textContent = '';
    document.getElementById('progress-section').style.display = 'block';
    document.getElementById('bar-fill').style.width = '0%';
    document.getElementById('bar-label').textContent = '';
    document.getElementById('playlist-pill').style.display = 'none';
    setBtn(true);

    if (es) es.close();
    es = new EventSource('/api/concerts?playlist_url=' + encodeURIComponent(url));

    es.addEventListener('status', e => {
      setText(JSON.parse(e.data).message);
    });

    es.addEventListener('playlist_info', e => {
      const d = JSON.parse(e.data);
      playlistLabel = d.name || 'NYC Concerts';
      const pill = document.getElementById('playlist-pill');
      const img  = document.getElementById('pill-img');
      img.src = d.image || '';
      img.style.display = d.image ? 'block' : 'none';
      document.getElementById('pill-name').textContent = playlistLabel;
      pill.style.display = 'flex';
    });

    es.addEventListener('artists_found', e => {
      const d = JSON.parse(e.data);
      setText('Found ' + d.count + ' artists — searching for NYC shows...');
    });

    es.addEventListener('progress', e => {
      const d = JSON.parse(e.data);
      const pct = Math.round((d.current / d.total) * 100);
      document.getElementById('bar-fill').style.width = pct + '%';
      document.getElementById('bar-label').textContent = d.current + ' / ' + d.total;
      setText('Checking: ' + d.artist);
    });

    es.addEventListener('result', e => {
      const data = JSON.parse(e.data);
      allResults.push(data);
      appendCard(data);
    });

    es.addEventListener('done', e => {
      const d = JSON.parse(e.data);
      es.close();
      document.getElementById('progress-section').style.display = 'none';
      setBtn(false);

      const row = document.getElementById('summary-row');
      const s   = document.getElementById('summary');
      row.style.display = 'flex';
      document.getElementById('dl-btn').style.display = d.artists_with_shows > 0 ? '' : 'none';

      if (d.artists_with_shows > 0) {
        s.innerHTML = 'Found <strong>' + d.artists_with_shows + '</strong> artist'
          + (d.artists_with_shows !== 1 ? 's' : '')
          + ' with upcoming NYC shows out of ' + d.total_artists + ' in the playlist.';
      } else {
        s.textContent = 'No upcoming NYC shows found for any of the ' + d.total_artists + ' artists in this playlist.';
        document.getElementById('results').innerHTML =
          '<div class="empty-state"><h3>No shows found</h3>'
          + '<p>Try a different playlist or check back closer to show season.</p></div>';
      }
    });

    es.addEventListener('error', e => {
      if (e.data) {
        document.getElementById('results').innerHTML =
          '<div class="error-box">' + esc(JSON.parse(e.data).message) + '</div>';
      }
      finish();
    });

    es.onerror = () => {
      if (document.getElementById('search-btn').disabled) finish();
    };
  }

  function finish() {
    document.getElementById('progress-section').style.display = 'none';
    setBtn(false);
    if (es) es.close();
  }

  function setBtn(loading) {
    const btn = document.getElementById('search-btn');
    btn.disabled = loading;
    btn.textContent = loading ? 'Searching...' : 'Find Concerts';
  }

  function setText(msg) {
    document.getElementById('status-text').textContent = msg;
  }

  function appendCard(data) {
    const rows = data.concerts.map(c => {
      const addr = c.address ? c.address + ', New York, NY' : 'New York, NY';
      const time = c.time ? ' &bull; ' + esc(c.time) : '';
      const price = c.price
        ? '<span class="price-chip">' + esc(c.price) + '</span>' : '';

      return '<li class="concert-row">'
        + '<div class="concert-info">'
        +   '<div class="concert-title">' + esc(c.event_name || '') + '</div>'
        +   '<div class="concert-meta">'
        +     '<span>&#128197; ' + esc(c.date || '') + time + '</span>'
        +     '<span>&#128205; ' + esc(c.venue || '') + ' &mdash; ' + esc(addr) + '</span>'
        +     (price ? '<span>' + price + '</span>' : '')
        +   '</div>'
        + '</div>'
        + '<a class="tix-btn" href="' + esc(c.tickets_url || '#') + '" target="_blank" rel="noopener">Get Tickets</a>'
        + '</li>';
    }).join('');

    const spotifyLink = data.spotify_url
      ? '<a href="' + esc(data.spotify_url) + '" target="_blank" rel="noopener">Open in Spotify</a>'
      : '';

    const count = data.concerts.length;
    const card = document.createElement('div');
    card.className = 'artist-card';
    card.innerHTML =
      '<div class="artist-header">'
      +   '<div class="artist-name">' + esc(data.artist) + (spotifyLink ? ' ' + spotifyLink : '') + '</div>'
      +   '<span class="show-badge">' + count + ' show' + (count !== 1 ? 's' : '') + '</span>'
      + '</div>'
      + '<ul class="concert-list">' + rows + '</ul>';

    document.getElementById('results').appendChild(card);
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  function downloadTxt() {
    // Flatten all concerts with their artist, then sort by date ascending
    const flat = [];
    allResults.forEach(r => {
      r.concerts.forEach(c => {
        flat.push({ artist: r.artist, ...c });
      });
    });
    flat.sort((a, b) => (a.date_raw || '').localeCompare(b.date_raw || ''));

    const lines = [];
    const now = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    lines.push('NYC UPCOMING CONCERTS');
    lines.push('Playlist: ' + playlistLabel);
    lines.push('Generated: ' + now);
    lines.push('='.repeat(60));
    lines.push('');

    flat.forEach(c => {
      lines.push(c.artist.toUpperCase());
      lines.push('  Event : ' + (c.event_name || ''));
      lines.push('  Date  : ' + (c.date || 'TBA') + (c.time ? '  ' + c.time : ''));
      lines.push('  Venue : ' + (c.venue || 'New York, NY'));
      lines.push('  Tix   : ' + (c.tickets_url || ''));
      lines.push('-'.repeat(60));
    });

    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nyc_concerts.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  }
</script>

</body>
</html>
